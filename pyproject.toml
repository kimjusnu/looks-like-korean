[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looks-like-korean"
version = "0.4.0"
description = "장르별 한국어 문체 검사 엔진: 말투 일치, 문장 패턴, 윤문 전후 사실 대조. LLM 호출 없음, 외부 의존성 없음"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
looks-like-korean = "looks_like_korean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
